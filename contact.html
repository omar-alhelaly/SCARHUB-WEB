<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#0a0708;--p:#140d0f;--p2:#1c1114;--r:#e11d2e;--r2:#ff4455;--t:#ece6e7;--m:#9c8f92;--b:#2c1a1e}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#2a0b10 0,transparent 60%),var(--bg);color:var(--t);font:16px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif}
a{color:var(--r2);text-decoration:none}
nav{position:sticky;top:0;z-index:5;display:flex;gap:18px;align-items:center;padding:12px 5vw;background:#0a0708ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--b)}
nav b{color:var(--r);letter-spacing:.15em;margin-inline-end:auto}nav a{color:var(--t);font-size:14px}
button.lang{background:none;border:1px solid var(--r);color:var(--r2);padding:4px 12px;border-radius:6px;cursor:pointer;font-weight:600}
header{padding:60px 5vw 30px;max-width:1100px;margin:auto}
pre.logo{direction:ltr;text-align:left;color:var(--r);font-size:clamp(10px,2.4vw,18px);line-height:1.15;overflow:hidden;margin:0 0 20px;text-shadow:0 0 18px #e11d2e66}
h1{font-size:clamp(28px,4.5vw,48px);margin:0 0 10px;line-height:1.15}h1 span{color:var(--r)}
.sub{color:var(--m);max-width:700px;font-size:18px}
.cta{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:8px 16px;border:1px solid var(--r);border-radius:8px;color:var(--t);font-size:14px;transition:.2s}
.btn:hover,.btn.f{background:var(--r);color:#fff}
.stats{display:flex;gap:30px;margin-top:34px;flex-wrap:wrap}.stats div{font-size:13px;color:var(--m)}.stats b{display:block;font-size:30px;color:var(--r2)}
section{max-width:1200px;margin:auto;padding:50px 5vw}
h2{font-size:28px;margin:0 0 6px}h2:after{content:"";display:block;width:60px;height:3px;background:var(--r);margin-top:8px}
.notice{background:var(--p);border:1px solid var(--r);border-inline-start:5px solid var(--r);padding:16px 20px;border-radius:8px;color:#e9d6d8}
input#q{width:100%;max-width:380px;margin:18px 0;padding:10px 14px;background:var(--p);border:1px solid var(--b);color:var(--t);border-radius:8px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px}
.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--b);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;transition:.2s}
.card:hover{border-color:var(--r);transform:translateY(-3px);box-shadow:0 8px 30px #e11d2e22}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}h3{margin:0;color:var(--r2);letter-spacing:.06em;font-size:20px}
.tag{font-size:11px;padding:2px 9px;border:1px solid var(--b);border-radius:20px;color:var(--m)}
.card p{margin:0;color:#cfc6c8;font-size:14.5px}
.card img{width:100%;border-radius:8px;border:1px solid var(--b);max-height:230px;object-fit:cover;object-position:top}
.cmds{display:flex;flex-direction:column;gap:6px;direction:ltr;text-align:left}
code{background:#050304;border:1px solid var(--b);border-radius:6px;padding:6px 10px;font:12.5px ui-monospace,Menlo,Consolas,monospace;color:#ffb3ba;overflow-x:auto;white-space:pre}
code:before{content:"$ ";color:var(--r)}
.foot{margin-top:auto}.priv{font-size:12.5px;color:var(--m)}.priv:before{content:""}
.poster{display:flex;gap:30px;align-items:center;flex-wrap:wrap}.poster img{width:300px;max-width:100%;border:1px solid var(--b);border-radius:10px}
.contact{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:20px}
.contact a{display:flex;flex-direction:column;background:var(--p);border:1px solid var(--b);border-radius:10px;padding:14px 16px;color:var(--t);transition:.2s}
.contact a:hover{border-color:var(--r);background:var(--p2)}.contact small{color:var(--m);direction:ltr;overflow-wrap:anywhere}.contact b{color:var(--r2)}
footer{text-align:center;color:var(--m);padding:40px 5vw;border-top:1px solid var(--b);font-size:13px}
[dir=rtl] .cmds,[dir=rtl] .contact small{direction:ltr}
@media (min-width:1024px){
body{font-size:17px}
nav{padding:14px max(5vw,calc((100vw - 1360px)/2));gap:28px}
nav a{font-size:15px}
header{max-width:1360px;padding:90px 5vw 50px}
pre.logo{font-size:22px}
h1{font-size:64px}
.sub{max-width:860px;font-size:20px}
.stats{gap:60px}.stats b{font-size:40px}
section{max-width:1360px;padding:70px 5vw}
h2{font-size:34px}
.grid{grid-template-columns:repeat(3,1fr);gap:26px}
.card{padding:24px;min-width:0}
.card p{font-size:15.5px}
.card img{max-height:260px}
.contact{grid-template-columns:repeat(4,1fr);gap:18px}
.poster img{width:420px}
}
@media (min-width:1700px){.grid{grid-template-columns:repeat(4,1fr)}section,header{max-width:1560px}}
nav a.on{color:var(--r2);border-bottom:2px solid var(--r)}
</style></head><body>

<script>
window.addEventListener("DOMContentLoaded",function(){document.querySelectorAll("img[data-k]").forEach(function(i){i.src=(window.SCAR_IMG||{})[i.dataset.k]||""})});
const $=s=>document.querySelectorAll(s);let L=localStorage.l||'en';

document.getElementById('lang').onclick=()=>set(L=='en'?'ar':'en');set(L);
